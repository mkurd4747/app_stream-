name: Database Migrations

on:
  push:
    paths:
      - "migrations/**"
      - "alembic.ini"
      - "src/tit_stream/database.py"
      - "src/tit_stream/database_models.py"
      - "src/tit_stream/config.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/database-migrations.yml"

  pull_request:
    paths:
      - "migrations/**"
      - "alembic.ini"
      - "src/tit_stream/database.py"
      - "src/tit_stream/database_models.py"
      - "src/tit_stream/config.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/database-migrations.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest

    env:
      TIT_STREAM_DATABASE_URL: sqlite:///migration_ci.db
      PYTHONPATH: src

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Show migration history
        run: python -m alembic history

      - name: Check migration heads
        run: python -m alembic heads

      - name: Apply all migrations
        run: python -m alembic upgrade head

      - name: Show current revision
        run: python -m alembic current

      - name: Check for missing migrations
        run: python -m alembic check

      - name: Downgrade all migrations
        run: python -m alembic downgrade base

      - name: Reapply all migrations
        run: python -m alembic upgrade head

      - name: Confirm final revision
        run: python -m alembic current